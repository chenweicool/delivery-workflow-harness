name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(node --print 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version."
            exit 1
          fi

      - name: Run package checks
        run: npm run check && npm run test:regression && npm run pack:dry

      - name: Select npm distribution tag
        id: npm_tag
        shell: bash
        run: |
          package_version="$(node --print 'require("./package.json").version')"
          if [[ "$package_version" == *-* ]]; then
            echo "value=beta" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm Trusted Publishing
        run: npm publish --provenance --tag "${{ steps.npm_tag.outputs.value }}"
